{% set version = "0.9.1" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-quitefastmst
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/quitefastmst_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/quitefastmst/quitefastmst_{{ version }}.tar.gz
  sha256: 16052f176182284afb39f80cd729d8abbf5c2f58ae473b7538d8855d0b4d08b1

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
    - {{ compiler('c') }}          # [not win]
    - {{ stdlib('c') }}            # [not win]
    - {{ compiler('m2w64_c') }}    # [win]
    - {{ stdlib('m2w64_c') }}      # [win]
    - {{ compiler('cxx') }}        # [not win]
    - {{ compiler('m2w64_cxx') }}  # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}make
    - {{ posix }}sed               # [win]
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
    - llvm-openmp                  # [osx]
  host:
    - r-base
    - r-rcpp
    - libgomp                      # [not osx]
    - llvm-openmp                  # [osx]
  run:
    - r-base
    - r-rcpp
    - llvm-openmp                  # [osx]

test:
  commands:
    - $R -e "library('quitefastmst')"           # [not win]
    - "\"%R%\" -e \"library('quitefastmst')\""  # [win]

about:
  home: https://quitefastmst.gagolewski.com/
  dev_url: https://github.com/gagolews/quitefastmst
  license: AGPL-3.0-only
  summary: Functions to compute Euclidean minimum spanning trees using single-, sesqui-, and dual-tree Boruvka algorithms.  Thanks to K-d trees, they are fast in spaces of low intrinsic dimensionality.  Mutual reachability distances (used in the definition of the 'HDBSCAN*' algorithm) are also supported.  The package 
    also features relatively fast fallback minimum spanning tree and nearest-neighbours algorithms for spaces of higher dimensionality.  The 'Python' version of 'quitefastmst' is available via 'PyPI'.
  license_family: AGPL
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/AGPL-3'

extra:
  recipe-maintainers:
    - conda-forge/r
